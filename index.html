s.filter(r=>!ehSec(r)).map(r=>estrutura(s,r));\n      if(n>1) for(let k=1;k<=n;k++){ const e=estrutura(s,tpl); e.line=`Sec ${k}`; e.earth='Sec '+Array.from({length:n},(_,j)=>j+1).filter(j=>j!==k).join('/'); rows.push(e); } }\n    if(rows.length){ sd.rows=rows; c++; } }));\n  return c; }\n\n/* ================= cálculo ================= */\nfunction ctxDe(m,d,f){ const pl={...d.placa,...(d.fases[f]?.placa||{})}; const prm={}, auto={};\n  (m.params||[]).forEach(p=>{ if(p.t==='sel'){ prm[p.k]=d.prm[p.k]||''; return; } let v=num(d.prm[p.k]); if(v==null&&p.auto){ try{ v=p.auto(pl); }catch(e){ v=null; } if(isNum(v)) auto[p.k]=v; else v=null; } prm[p.k]=v; });\n  return {pl,prm,auto,cond:d.fases[f]?.cond||{}}; }\nfunction herdado(c,x){ if(c.defCond==='temp') return num(x.cond.temp); if(c.herda){ try{ const v=c.herda(x); return isNum(v)?v:null; }catch(e){ return null; } } return null; }\nconst ehMedida=c=> c.t==='in'&&!c.opt&&!c.defCond&&!c.herda&&c.def==null&&!c.estr;\nfunction calcSecao(m,s,d,f){\n  const x=ctxDe(m,d,f), sd=d.fases[f].sec[s.id];\n  if(s.tipo==='checklist'){ const it=sd.itens; const pend=it.filter(v=>!v).length; return {tipo:'checklist',pend,itens:it}; }\n  const rows=sd.rows.map((raw,i)=>{\n    const r={}; s.cols.forEach(c=>{ if(c.t==='in'){ let v=num(raw[c.k]); if(v==null) v=herdado(c,x); r[c.k]=v; } else if(c.t!=='calc') r[c.k]=raw[c.k]??''; });\n    const c={}; s.cols.filter(cc=>cc.t==='calc').forEach(cc=>{ try{ c[cc.k]=cc.fn(r,c,x); }catch(e){ c[cc.k]=null; } if(!isNum(c[cc.k])) c[cc.k]=null; });\n    const temDado=s.cols.some(cc=>ehMedida(cc)&&isNum(num(raw[cc.k]))) || s.cols.some(cc=>cc.t==='sel'&&!cc.estr&&raw[cc.k]);\n    let ok=null; if(temDado&&s.crit){ try{ ok=s.crit(r,c,x,i); }catch(e){ ok=null; } }\n    if(ok==null&&temDado&&s.manual&&raw.ap) ok= raw.ap==='Sim';\n    return {raw,r,c,ok,temDado};\n  });\n  const deriv=(s.derivados||[]).map(dv=>{ const v=dv.fn(rows.map(x=>x.r)); let ok=null; if(dv.crit) ok=dv.crit(v,x); return {...dv,v,ok}; });\n  if(s.desvio){ const vals=rows.map(o=>o.r[s.desvio]).filter(isNum); if(vals.length>=2){ const mn=Math.min(...vals),mx=Math.max(...vals); const v=mn>0?(mx-mn)/mn*100:null; const lim=x.prm[s.desvioPrm||'desvMax']; deriv.push({l:'Desvio entre fases',u:'%',dec:1,v,ok:isNum(lim)&&isNum(v)?v<=lim:null,critTxt:isNum(lim)?`≤ ${fmtN(lim,1)} %`:null}); } }\n  const critTxt=s.critTxt?s.critTxt(x):null;\n  return {tipo:'tabela',rows,deriv,critTxt,x};\n}\nfunction avaliar(m,d){ if(m.spcs) return spAvaliar(m,d);\n  const falhas=[], pend=[]; let auto=0, semCrit=0;\n  fasesDe(m).forEach(f=>{\n    const pf=f==='_'?'':`Fase ${f} · `;\n    m.secoes.forEach(s=>{\n      const k=calcSecao(m,s,d,f);\n      if(k.tipo==='checklist'){ if(k.pend&&!s.opcional) pend.push(`${pf}${s.titulo}: ${k.pend} item(ns) sem marcação`); return; }\n      k.rows.forEach((o,i)=>{ if(!o.temDado) return; if(o.ok===false) falhas.push(`${pf}${s.titulo} — linha ${i+1}`); else if(o.ok===true) auto++; else if(s.manual) pend.push(`${pf}${s.titulo} — linha ${i+1} sem aprovação`); else semCrit++; });\n      k.deriv.forEach(dv=>{ if(dv.ok===false) falhas.push(`${pf}${dv.l}: ${fmtN(dv.v,dv.dec)} ${dv.u||''}`); else if(dv.ok===true) auto++; });\n    });\n  });\n  const dt=d.ident.data; (d.inst||[]).forEach(it=>{ if(it.calib&&dt&&it.calib<dt) pend.push(`Instrumento ${[it.eq,it.modelo,it.serie&&'nº '+it.serie].filter(Boolean).join(' ')} com calibração vencida na data do ensaio`); });\n  Object.entries(d.fotos||{}).forEach(([f,l])=>{ (l||[]).forEach((ft,i)=>{ if(!ft.gps) pend.push(`${rotuloFoto(f)?rotuloFoto(f)+' · ':''}Foto da placa ${i+1} sem GPS`); }); });\n  let status;\n  if(falhas.length) status='reprovado';\n  else if(d.decisao==='Reprovado') status='reprovado';\n  else if(d.decisao==='Aprovado') status='aprovado';\n  else status=(auto>0&&!pend.length&&!semCrit)?'aprovado-auto':'pendente';\n  return {status,falhas,pend,auto,semCrit};\n}\n\n/* ================= interface ================= */\nfunction inputHTML(id,val,attrs=''){ return `<input id=\"${id}\" value=\"${esc(val)}\" ${attrs}>`; }\nfunction fld(path,label,val,u,opts){ const id='f_'+path.replace(/[^a-z0-9]/gi,'_');\n  if(opts&&opts.sel) return `<label class=\"fld\" for=\"${id}\">${esc(label)}<select id=\"${id}\" data-p=\"${path}\">${opts.sel.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value=\"${esc(v)}\"${String(val)===String(v)?' selected':''}>${esc(t)}<\/option>`}).join('')}<\/select><\/label>`;\n  if(opts&&opts.area) return `<label class=\"fld\" for=\"${id}\">${esc(label)}<textarea id=\"${id}\" data-p=\"${path}\" rows=\"${opts.area}\">${esc(val)}<\/textarea><\/label>`;\n  return `<label class=\"fld\" for=\"${id}\">${esc(label)}${u?` <span class=\"u\">(${esc(u)})<\/span>`:''}<input id=\"${id}\" data-p=\"${path}\" value=\"${esc(val)}\"${opts&&opts.type?` type=\"${opts.type}\"`:''}${u||(opts&&opts.num)?' inputmode=\"decimal\"':''} enterkeyhint=\"next\">${opts&&opts.dica?`<span class=\"dica\">${esc(opts.dica)}<\/span>`:''}<\/label>`;\n}\nfunction placaFld(p,path,val){ return fld(path,p.l,val,p.u,p.gera?{num:true,dica:'Preenchido, o app monta as linhas dos ensaios por secundário.'}:null); }\nfunction prmHTML(p,d,x){ const id='f_prm_'+p.k, val=d.prm[p.k]??''; let inp;\n  if(p.t==='sel') inp=`<select id=\"${id}\" data-p=\"prm.${p.k}\">${p.opts.map(([v,t])=>`<option value=\"${esc(v)}\"${String(val)===String(v)?' selected':''}>${esc(t)}<\/option>`).join('')}<\/select>`;\n  else { const a=x.auto[p.k]; const ph=isNum(a)?` placeholder=\"${esc(fmtN(a))} (${esc(p.autoTxt||'automático')})\"`:' placeholder=\"Sem limite: decisão do responsável\"'; inp=`<input id=\"${id}\" data-p=\"prm.${p.k}\" value=\"${esc(val)}\" inputmode=\"decimal\" enterkeyhint=\"next\"${ph}>`; }\n  return `<label class=\"fld\" for=\"${id}\">${esc(p.l)}${p.u?` <span class=\"u\">(${esc(p.u)})<\/span>`:''}${inp}${p.ref?`<small class=\"ref\">Referência: ${esc(p.ref)}<\/small>`:''}<\/label>`; }\nconst FURL=new Map(); function fotoURL(f){ if(!f.src) return ''; if(!FURL.has(f.id)){ try{ FURL.set(f.id,URL.createObjectURL(dataURLtoBlob(f.src))); }catch(e){ return f.src; } } return FURL.get(f.id); }\n/* grupos de foto: por fase (TC/TP), por polo (equipamentos tripolares) e placa geral */\nconst rotuloFoto=sc=> sc==='_'?'':sc.startsWith('_')?'Polo '+sc.slice(1):'Fase '+sc;\nconst gruposFoto=(m,sc)=> m.spcs ? [['_','Fotos do teste (IED, painel, tela da mala)']] : sc==='_'&&m.polos ? [...m.polos.map(p=>['_'+p,'Placa do polo '+p]),['_','Placa geral / comando']] : [[sc,'Foto da placa']];\nfunction fotosHTML(m,d,sc){ const gs=gruposFoto(m,sc);\n  if(gs.length>1) return `<div class=\"fotos\"><div class=\"fotos-h\"><b>Fotos das placas<\/b><span class=\"hint\">Uma foto por polo e, se houver, a placa geral do comando ou mecanismo. Cada foto sai com data, hora e GPS e vai para o relatório.<\/span><\/div><div class=\"fotos-gs\">${gs.map(([k,t])=>fotosGrupoHTML(m,d,k,t,true)).join('')}<\/div><\/div>`;\n  return fotosGrupoHTML(m,d,sc,'Foto da placa',false); }\nfunction fotosGrupoHTML(m,d,sc,titulo,sub){ const fl=(d.fotos&&d.fotos[sc])||[];\n  return `<div class=\"${sub?'fotos-g':'fotos'}\"><div class=\"fotos-h\"><b>${esc(titulo)}<\/b>${sub?(fl.length?`<span class=\"hint\">${fl.length} foto(s)<\/span>`:'<span class=\"hint\">sem foto<\/span>'):'<span class=\"hint\">A foto sai com data, hora e GPS gravados na imagem e vai para o relatório.<\/span>'}<\/div>\n  ${fl.length?`<div class=\"fotos-l\">${fl.map((f,i)=>`<figure class=\"foto\"><img src=\"${fotoURL(f)}\" alt=\"Foto da placa ${i+1}\"><figcaption>${esc(fmtDH(f.t))}<br>${f.gps?`${f.lat.toFixed(5)}, ${f.lon.toFixed(5)} (±${Math.round(f.acc)} m)`:`<span class=\"warn\">Sem GPS: ${esc(f.gpsMsg||'')}<\/span>`}<\/figcaption><button class=\"btn sm\" data-act=\"foto-del\" data-sc=\"${sc}\" data-i=\"${i}\" aria-label=\"Remover foto ${i+1}\">Remover<\/button><\/figure>`).join('')}<\/div>`:''}\n  <div class=\"fotos-a\"><label class=\"btn sm ${fl.length?'':'pri'}\" data-gps>${fl.length?'Fotografar outra':(sub?'Fotografar':'Fotografar placa')}<input type=\"file\" accept=\"image/*\" capture=\"environment\" class=\"file-in\" data-foto=\"${sc}\"><\/label>${fl.length&&IA.ok?`<button class=\"btn sm\" data-act=\"ler-placa\" data-sc=\"${sc}\">Ler dados da placa<\/button>`:''}<\/div>\n  ${fl.length&&IA.ok?'<p class=\"hint\">\"Ler dados da placa\" preenche os campos vazios a partir da foto. Confira antes de emitir.<\/p>':''}<\/div>`; }\nfunction render(focusId){\n  if(!S.d||!M(S.modelo)) return;\n  if(M(S.modelo).spcs) return renderSPCS(focusId);\n  const m=M(S.modelo), d=S.d, fs=fasesDe(m);\n  const fAtual=S.fase&&fs.includes(S.fase)?S.fase:fs[0]; S.fase=fAtual;\n  const ev=avaliar(m,d);\n  const comuns=m.placa.filter(p=>!p.fase), porFase=m.placa.filter(p=>p.fase);\n  let h='';\n  h+=`<section class=\"card\"><div class=\"card-h\"><h2>${esc(m.nome)}<\/h2><span class=\"pill p-na\">${esc(m.form)}<\/span><\/div><div class=\"card-b\">\n    <div class=\"modelo-info\"><span><b>Base:<\/b> ${esc(m.base)}<\/span><span><b>Normas:<\/b> ${esc(m.normas)}<\/span><\/div>\n    <div class=\"grid\">\n      ${fld('ident.contexto','Tipo de ensaio',d.ident.contexto,null,{sel:['Comissionamento','Manutenção preventiva','Manutenção corretiva','Após ocorrência']})}\n      ${fld('ident.regiao','Região',d.ident.regiao)}${fld('ident.se','Subestação',d.ident.se)}${fld('ident.posicao','Posição (tag)',d.ident.posicao)}\n      ${fld('ident.tomb','Tombamento',d.ident.tomb)}${fld('ident.codigo','Código da instalação',d.ident.codigo)}${fld('ident.data','Data do ensaio',d.ident.data,null,{type:'date'})}\n      ${fld('ident.doc','Nº do documento',d.ident.doc)}${fld('ident.rev','Revisão',d.ident.rev)}\n    <\/div><\/div><\/section>`;\n  const semFase=fs.length===1;\n  if(comuns.length) h+=`<section class=\"card\"><div class=\"card-h\"><h2>Dados de placa<\/h2><\/div><div class=\"card-b\"><div class=\"grid\">${comuns.map(p=>placaFld(p,'placa.'+p.k,d.placa[p.k]??'')).join('')}<\/div>${semFase?fotosH nt\" placeholder=\"Ex.: 47 99999-0000\"><\/label><label class=\"fld\">Tipo<select id=\"uTipo\"><option value=\"externo\">Externo<\/option><option value=\"interno\">Interno<\/option><option value=\"admin\">Administrador<\/option><\/select><\/label><button class=\"btn acc\" type=\"submit\" style=\"align-self:end\">Adicionar<\/button><\/form>\n    <div class=\"ul\">${GS.usuarios.map(u=>`<div class=\"ur\"><div><b>${esc(u.nome)}<\/b><span class=\"hint\">${esc(u.contato||'sem contato')} · ${esc({admin:'Administrador',interno:'Interno',externo:'Externo'}[u.tipo]||u.tipo)}<\/span><br><span class=\"cod\">${esc(u.codigo)}<\/span><\/div>\n      <div class=\"rc-a\">${zap(u)}<button class=\"btn sm\" data-act=\"h-ucod\" data-id=\"${esc(u.id)}\">Novo código<\/button>${u.id!==GS.me.id?`<button class=\"btn sm\" data-act=\"h-udel\" data-id=\"${esc(u.id)}\">Remover<\/button>`:''}<\/div><\/div>`).join('')}<\/div>\n    ${GS.url?`<p class=\"hint\">Link do app para enviar à equipe: <span class=\"mono\">${esc(GS.url)}<\/span><\/p>`:''}<\/div><\/section>`; }\nfunction desenharHome(){\n  const q=HOME.q.trim().toLowerCase(), ls=HOME.lista.filter(r=>!q||[r.posicao,r.se,r.nome,r.contexto].join(' ').toLowerCase().includes(q));\n  const grupos=[...new Set(MODELOS.map(m=>m.grupo))];\n  let h='';\n  if(HOME.novo) h+=`<section class=\"card\"><div class=\"card-h\"><h2>Novo relatório<\/h2><button class=\"btn sm\" data-act=\"h-cancelar\">Cancelar<\/button><\/div><div class=\"card-b\"><p class=\"hint\">Escolha o equipamento. A subestação, a equipe e os instrumentos da última vez já vêm preenchidos.<\/p>\n    ${grupos.map(g=>`<p class=\"mg-h\">${esc(g)}<\/p><div class=\"mgrid\">${MODELOS.filter(m=>m.grupo===g).map(m=>`<button class=\"btn\" data-act=\"h-modelo\" data-m=\"${m.id}\">${esc(m.nome)}<\/button>`).join('')}<\/div>`).join('')}<\/div><\/section>`;\n  h+=`<section class=\"card\"><div class=\"card-h\"><h2>${GAS?'Relatórios':'Meus relatórios'}<\/h2><div class=\"acts\">${GAS?`<span class=\"prog\">${es  no Drive e pode restaurar em outro aparelho.'}<\/p><\/div><\/section>`;\n  $('#main').innerHTML=h; }\nfunction abrirRel(id,d,pode){ const m=M(d.modelo); if(!m){ toast('Modelo de ensaio não reconhecido'); return; }\n  S.ro=pode===false; setSalvo(S.ro?'Somente leitura':(GAS?'':''));\n  S.rid=id; S.modelo=d.modelo; S.fase=null; S.d=migrar(m,d); document.body.classList.remove('home'); document.body.classList.add('rel');\n  if(PWA){ try{ history.pushState({rel:id},''); }catch(e){} } render(); window.scrollTo(0,0); }\nfunction novoId(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }\nfunction duplicarDado(m,o,manter){ if(m.spcs) return spDuplicar(m,o); const d=novoDado(m), i=o.ident||{};\n  ['regiao','se','codigo','contexto','empresa','executante','funcao','supervisor','aprovador'].forEach(k=>{ if(i[k]) d.ident[k]=i[k]; });\n  d.placa=JSON.parse(JSON.stringify(o.placa||{})); d.prm=JSON.parse(JSON.stringify(o.prm||d.prm)); d.inst=JSON.parse(JSON.stringify(o.inst||d.inst)); d.refInterna=o.refInterna||'';\n  fasesDe(m).forEach(f=>{ const A=(o.fases||{})[f]; if(!A) return; const B=d.fases[f]; B.cond.tempo=A.cond?.tempo||B.cond.tempo; if(manter) B.placa=JSON.parse(JSON.stringify(A.placa||{}));\n    m.secoes.forEach(s=>{ if(s.tipo==='tabela'&&A.sec&&A.sec[s.id]) B.sec[s.id]={rows:A.sec[s.id].rows.map(r=>estrutura(s,r))}; }); });\n  return d; }\nasync function acaoHome(a,b){\n  if(a==='h-novo'){ HOME.novo=true; desenharHome(); window.scrollTo(0,0); }\n  if(a==='h-cancelar'){ HOME.novo=false; desenharHome(); }\n  if(a==='h-modelo'){ HOME.novo=false; const m=M(b.dataset.m); abrirRel(novoId(),novoDado(m)); }\n  if(a==='h-abrir'){ b.disabled=true; try{ const r=await STORE.get(b.dataset.id); if(r) abrirRel(b.dataset.id,r.d,r.pode); else toast('Relatório não encontrado'); }catch(e){ toast(String(e.message||e)); } finally{ b.disabled=false; } }\n  if(a==='h-dup'){ let r=null; try{ r=await STORE.get(b.dataset.id); }catch(e){ toast(String(e.message||e)); } if(!r) return; const m=M(r.d.modelo); const id=novoId(); S.rid=id; S.d=duplicarDado(m,r.d); await gravarRel(); abrirRel(id,S.d); toast('Cópia criada com placa, ligações e critérios, sem as medições. Ajuste a posição e o nº de série.'); }\n  if(a==='h-del'){ if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent='Confirmar'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='Excluir'; } },4000); return; }\n    try{ await STORE.del(b.dataset.id); toast('Relatório excluído'); }catch(e){ toast(String(e.message||e)); } renderHome(); }\n  if(a==='h-pdf'){ try{ const x=await API.call('api_file',GS.code,b.dataset.id); const bin=atob(x.b64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); await salvarArquivo(x.name||b.dataset.n,new Blob([u8],{type:'application/pdf'})); }catch(e){ toast(String(e.message||e)); } }\n  if(a==='h-sair'){ if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent='Confirmar saída'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='Sair'; } },4000); return; } GS.code=''; GS.me=null; try{ localStorage.removeItem('ens:code'); }catch(e){} HOME.lista=[]; renderHome(); }\n  if(a==='h-usuarios'){ desenharUsuarios(); }\n  if(a==='h-fechar-u'){ renderHome(); }\n  if(a==='h-ucod'){ try{ await API.call('api_user_newcode',GS.code,b.dataset.id); await STORE.lista(); desenharUsuarios(); toast('Código novo gerado. O antigo deixou de valer.'); }catch(e){ toast(String(e.message||e)); } }\n  if(a==='h-udel'){ if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent='Confirmar'; return; } try{ await API.call('api_user_del',GS.code,b.dataset.id); await STORE.lista(); desenharUsuarios(); toast('Usuário removido'); }catch(e){ toast(String(e.message||e)); } }\n  if(a==='h-voltar'){ if(PWA&&history.state&&history.state.rel){ history.back(); return; } clearTimeout(salvar.t); await gravarRel(); renderHome(); }\n  if(a==='h-backup'){ const rs=await IDB.all('rel'); if(!rs.length){ toast('Nenhum relatório para salvar'); return; }\n    await salvarArquivo(`backup-relatorios-${hoje()}.json`,new Blob([JSON.stringify({app:'relatorios-ensaio',v:1,em:new Date().toISOString(),rel:rs})],{type:'application/json'})); }\n  if(a==='h-instalar'&&INST){ INST.prompt(); INST=null; $('#bInst').hidden=true; }\n}\ndocument.addEventListener('submit',async e=>{ const f=e.target, k=f.dataset&&f.dataset.gform; if(!k) return; e.preventDefault(); const bt=f.querySelector('button[type=submit]'); if(bt) bt.disabled=true;\n  try{\n    if(k==='login'){ const c=$('#gCod').value.trim().toUpperCase(); const me=await API.call('api_login',c); GS.code=c; try{ localStorage.setItem('ens:code',c); }catch(x){} toast('Bem-vindo, '+me.nome); renderHome(); }\n    if(k==='setup'){ const n=$('#gNome').value.trim(), c=$('#gCod').value.trim().toUpperCase(); if(c!==$('#gCod2').value.trim().toUpperCase()){ toast('Os códigos não conferem'); return; } await API.call('api_setup',n,c); GS.code=c; try{ localStorage.setItem('ens:code',c); }catch(x){} renderHome(); }\n    if(k==='user'){ const r=await API.call('api_user_save',GS.code,{nome:$('#uNome').value,contato:$('#uCont').value,tipo:$('#uTipo').value}); await STORE.lista(); desenharUsuarios(); toast('Usuário criado. Código: '+r.codigo); }\n  }catch(x){ toast(String(x.message||x)); } finally{ if(bt&&bt.isConnected) bt.disabled=false; } });\nasync function restaurar(f){ try{ const o=JSON.parse(await f.text()); let rs=[];\n    if(o&&o.app==='relatorios-ensaio'&&Array.isArray(o.rel)) rs=o.rel; else if(o&&o.modelo&&o.fases) rs=[{id:novoId(),d:o}]; else throw 0;\n    let n=0; for(const r of rs){ if(!r||!r.id||!r.d||!M(r.d.modelo)) continue; const m=M(r.d.modelo); r.d=migrar(m,r.d); await IDB.put('rel',r); await IDB.put('lista',resumoRel(r.id,r.d)); n++; }\n    toast(`${n} relatório(s) restaurado(s)`); renderHome(); }\n  catch(e){ toast('Arquivo não reconhecido. Use um backup gerado por este app.'); } }\nlet INST=null;\nwindow.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INST=e; const b=$('#bInst'); if(b) b.hidden=false; });\nwindow.addEventListener('popstate',()=>{ if(LIB&&S.rid){ clearTimeout(salvar.t); gravarRel().then(renderHome); } });\n\n/* ================= arquivos ================= */\nlet DL=null;\nasync function salvarArquivo(nome,blob){\n  if(EMB){ hostPost({ens:'save',nome,blob}); return; }\n  if(PWA&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&navigator.canShare){ try{ const f=new File([blob],nome,{type:blob.type}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:nome}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } }\n  if(DL){ try{ await DL.save({filename:nome,data:blob}); toast('Arquivo salvo'); return; }catch(e){ if(e&&e.code==='declined') return; } }\n  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),8000);\n}\nconst slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'');\nfunction nomeBase(){ const m=M(S.modelo),i=S.d.ident; return [m.sigla,i.posicao,slug(i.se),i.data].filter(Boolean).join('_')||'ensaio'; }\nfunction exportar(){ salvarArquivo(nomeBase()+'.json', new Blob([JSON.stringify(S.d,null,1)],{type:'application/json'})); }\nfunction importar(f){ const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.modelo||!M(d.modelo)) throw 0; S.modelo=d.modelo; S.d=migrar(M(d.modelo),d); S.fase=null; salvar(); $('#mSel').value=d.modelo; render(); toast('Dados abertos'); }catch(e){ toast('Arquivo não reconhecido. Use um .json salvo por este app.'); } }; fr.readAsText(f); }\n\n/* ================= PDF ================= */\nconst COR={verde:'#5C892F',verdeClaro:'#EEF4E6',laranja:'#F1A001',cinza:'#5B6457',linha:'#B9C4AE',calc:'#F1F5EB',ok:'#1F7A4D',bad:'#B4372C',pend:'#9A6408',ink:'#111111'};\nasync function sha256(txt){ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ let h=2166136261; for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i);h=Math.imul(h,16777619)>>>0;} return h.toString(16).padStart(8,'0').repeat(8); } }\nfunction pdfGrade(D,pares,n){ n=n||4; const rows=[]; for(let i=0;i<pares.length;i+=n){ const r=[]; for(let j=0;j<n;j++){ const p=pares[i+j]; r.push(p?{label:p[0],text:p[1]==null||p[1]===''?'—':String(p[1]),size:8.5}:{text:''}); } rows.push(r); }\n  D.table(Array(n).fill({w:1}),null,rows,{pad:3}); D.y+=6; }\nfunction pdfTitulo(D,t,min){ D.ensure(min||40); D.y+=4; D.rect(D.m.l,D.y,D.cw,15,{fill:COR.verdeClaro}); D.line(D.m.l,D.y+15,D.m.l+D.cw,D.y+15,{color:COR.verde,lw:1.1}); D.text(D.m.l+4,D.y+3.5,t.toUpperCase(),{size:8.5,font:'B',color:COR.verde}); D.y+=20; }\nfunction pdfNota(D,t,cor){ D.para(t,{size:7,color:cor||COR.cinza,lh:1.35}); }\nfunction pdfFotos(D,fl,titulo){ fl=fl.filter(f=>f.src); if(!fl.length) return; pdfTitulo(D,titulo||'Foto da placa',200); const gap=12, w=(D.cw-gap)/2, HM=300;\n  for(let i=0;i<fl.length;i+=2){ const par=fl.slice(i,i+2).map(f=>{ let ww=w, hh=w*(f.h||3)/(f.w||4); if(hh>HM){ ww=ww*HM/hh; hh=HM; } return {f,ww,hh}; });\n    const hmax=Math.max(...par.map(p=>p.hh)); D.ensure(hmax+22); const y0=D.y;\n    par.forEach((p,j)=>{ const x=D.m.l+j*(w+gap); D.image(p.f.src,x,y0,p.ww,p.hh); D.text(x,y0+p.hh+4,`${p.f.rot?p.f.rot.toUpperCase()+' · ':''}${fmtDH(p.f.t)} · ${p.f.gps?`${p.f.lat.toFixed(6)}, ${p.f.lon.toFixed(6)} (±${Math.round(p.f.acc)} m)`:'SEM GPS'}`,{size:6.8,color:p.f.gps?COR.cinza:COR.bad}); });\n    D.y=y0+hmax+18; } D.y+=2; }\nfunction valorAdotado(p,d,x){ if(p.t==='sel'){ const o=(p.opts||[]).find(o=>String(o[0])===String(d.prm[p.k]??'')); return o&&o[0]?o[1]:'—'; }\n  const raw=String(d.prm[p.k]??'').trim(); if(raw) return raw+(p.u?' '+p.u:''); if(isNum(x.auto[p.k])) return `${fmtN(x.auto[p.k])}${p.u const fmtMB=b=>{if(b==null||isNaN(b))return '—';b=+b;if(b>=1024**3)return (b/1024**3).toLocaleString('pt-BR',{maximumFractionDigits:2})+' GB';if(b>=1024**2)return (b/1024**2).toLocaleString('pt-BR',{maximumFractionDigits:1})+' MB';return Math.max(1,Math.round(b/1024))+' KB'};
const slugN=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,40)||'registro';

function addMeses(iso,n){if(!iso)return null;const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1+n,1),ult=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,ult));return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`}
const diasEntre=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);

/* ---------- PDF: base comum ---------- */
async function fotoPDF(id,max,q){
  const b=await fetchAsset(id),url=URL.createObjectURL(b);
  try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,(max||1024)/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
    return {src:c.toDataURL('image/jpeg',q||.6),w,h}}finally{URL.revokeObjectURL(url)}
}
async function fotosPDF(ids,rot){const out=[];let falhas=0;for(const id of ids||[]){try{out.push({...(await fotoPDF(id)),rot})}catch(e){falhas++}}return {fotos:out,falhas}}
function pdfDoc(titulo,sub){
  const gerado=new Date().toLocaleString('pt-BR');
  const D=new PDFK.Doc({margin:{l:36,r:36,t:84,b:46},decor:(D,p,n)=>{const R=D.W-36;
    D.image(PDF_LOGO,36,18,74);D.text(122,22,titulo.toUpperCase(),{size:11,font:'B',color:PC.verde});D.text(122,38,sub,{size:8.5,color:PC.cinza});
    D.text(R-90,22,`Folha ${p} de ${n}`,{size:8,font:'B',align:'right',width:90});D.line(36,64,R,64,{color:PC.laranja,lw:2});
    D.line(36,D.H-36,R,D.H-36,{color:PC.linha,lw:.5});D.text(36,D.H-31,`Gerado no SGC em ${gerado}`,{size:6.8,color:PC.cinza})}});
  D.title=titulo+' - '+sub;return D;
}
function pdfSec(D,t,min){D.ensure(min||40);D.y+=4;D.rect(D.m.l,D.y,D.cw,15,{fill:PC.verdeClaro});D.line(D.m.l,D.y+15,D.m.l+D.cw,D.y+15,{color:PC.verde,lw:1.1});D.text(D.m.l+4,D.y+3.5,t.toUpperCase(),{size:8.5,font:'B',color:PC.verde});D.y+=20}
function pdfPares(D,pares,n){n=n||3;const rows=[];for(let i=0;i<pares.length;i+=n){const r=[];for(let j=0;j<n;j++){const p=pares[i+j];r.push(p?{label:p[0],text:p[1]==null||p[1]===''?'—':String(p[1]),size:8.5}:{text:''})}rows.push(r)}D.table(Array(n).fill({w:1}),null,rows,{pad:3});D.y+=6}
function pdfTexto(D,t){if(t){D.para(t,{size:9,lh:1.35});D.y+=4}}
function pdfFotosGrade(D,fl){
  const gap=12,w=(D.cw-gap)/2,HM=250;
  for(let i=0;i<fl.length;i+=2){const par=fl.slice(i,i+2).map(f=>{let ww=w,hh=w*f.h/f.w;if(hh>HM){ww=ww*HM/hh;hh=HM}return {f,ww,hh}});
    const hm=Math.max(...par.map(p=>p.hh));D.ensure(hm+20);const y0=D.y;
    par.forEach((p,j)=>{const x=D.m.l+j*(w+gap);D.image(p.f.src,x,y0,p.ww,p.hh);if(p.f.rot)D.text(x,y0+p.hh+3,p.f.rot,{size:6.8,color:PC.cinza})});
    D.y=y0+hm+16}
  D.y+=2;
}
function pdfFotosSec(D,t,fl){if(!fl.length)return;const w=(D.cw-12)/2,hm=Math.max(...fl.slice(0,2).map(f=>Math.min(250,w*f.h/f.w)));pdfSec(D,t,hm+44);pdfFotosGrade(D,fl)}
const pdfBlob=D=>new Blob([D.output()],{type:'application/pdf'});
const quemQuando=(em,por)=>em?`${fmtDH(em)}${por?' por '+nameOf(por):''}`:'—';

/* ---------- ficha da pendência sanada ---------- */
async function fichaPendBlob(p){
  const D=pdfDoc('Ficha de pendência',`${p.seSigla||p.seNome||''} · ${p.locLabel||''}`);
  D.para(p.titulo||'Pendência',{size:14,font:'B'});D.y+=4;
  const st=p.status==='sanada'?'SANADA E VALIDADA':String(STAT[p.status]||p.status||'').toUpperCase();
  D.text(D.m.l,D.y,st,{size:9,font:'B',color:p.status==='sanada'?PC.ok:PC.pend});D.y+=16;
  pdfPares(D,[['Código',code(p)],['Prioridade',PRIO[p.prioridade]?.n],['Categoria',p.categoria],['Subestação',(p.seNome||'')+(p.seSigla?' ('+p.seSigla+')':'')],['Local',p.locLabel],['Responsável',p.responsavel],
    ['Prazo',p.prazo?fmtISO(p.prazo):''],['Registrada',quemQuando(p.criadoEm,p.criadoPor)],['Sanada',quemQuando(p.sanadoEm,p.sanadoPor)],['Validada',quemQuando(p.validadoEm,p.validadoPor)]],3);
  if(p.descricao){pdfSec(D,'Descrição');pdfTexto(D,p.descricao)}
  const a=await fotosPDF(p.fotos,'Antes'),b=await fotosPDF(p.fotosSol,'Solução');
  pdfFotosSec(D,'Fotos da pendência',a.fotos);
  pdfSec(D,'Solução');pdfTexto(D,p.obsSol||'Sem observação registrada.');
  if(p.parecer){D.para('Parecer de quem validou: '+p.parecer,{size:9,font:'I',lh:1.35});D.y+=4}
  pdfFotosSec(D,'Fotos da solução',b.fotos);
  const falhas=a.falhas+b.falhas;
  D.y+=6;D.para(`Registro permanente da pendência. As fotos foram reduzidas para arquivo${falhas?`; ${falhas} foto(s) não puderam ser incluídas`:''}.`,{size:7,color:falhas?PC.bad:PC.cinza});
  return {blob:pdfBlob(D),falhas,fotos:a.fotos.length+b.fotos.length};
}
const FICHA_RUN=new Set();
async function fichaGerar(id,o){
  o=o||{};if(FICHA_RUN.has(id)||!S.assets)return null;
  const p=S.pends.find(x=>x.id===id);if(!p||p.status!=='sanada')return null;
  FICHA_RUN.add(id);
  try{
    const r0=await fichaPendBlob(p);
    if(o.completa&&r0.falhas)throw new Error(`${r0.falhas} foto(s) da pendência ${code(p)} não abriram; as originais foram mantidas.`);
    const nome=`pendencia-${code(p).slice(1)}-${slugN(p.titulo)}.pdf`;
    const file=new File([r0.blob],nome,{type:'application/pdf'});
    const r=await S.assets.upload(file,upOpts('application/pdf',pastaDe(p.se,p.lk,['Pendências','Fichas PDF'])));
    const old=p.ficha;
    await S.db.doc('pendencias/'+id).update({ficha:{id:r.id,nome,tam:r.sizeBytes||r0.blob.size,em:Date.now(),por:S.me?.id||null,fotos:r0.fotos,completa:!r0.falhas}});
    if(old&&old.id&&old.id!==r.id)S.assets.delete(old.id).catch(()=>{});
    return {id:r.id,nome,blob:r0.blob,falhas:r0.falhas};
  }finally{FICHA_RUN.delete(id)}
}
/* depois de validar: gera a ficha sozinho, sem travar quem validou */
function fichaAuto(id){

const CALC={fr:null,pronto:null,ok:null,q:new Map()};

window.addEventListener('message',e=>{if(!CALC.fr||e.source!==CALC.fr.contentWindow)return;const m=e.data||{};
  if(m.ens==='ready'&&CALC.ok)CALC.ok();else if(m.ens==='calc-res'){const p=CALC.q.get(m.id);if(p){CALC.q.delete(m.id);p(m.out||[])}}});

async function abInflate(u8){const ds=new DecompressionStream('deflate-raw');const s=new Blob([u8]).stream().pipeThrough(ds);return new Uint8Array(await new Response(s).arrayBuffer())}
async function abUnzip(buf){
  const v=new DataView(buf),u=new Uint8Array(buf),out={};let e=-1;
  for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--)if(v.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('Arquivo .xlsx inválido.');
  let p=v.getUint32(e+16,true);const n=v.getUint16(e+10,true),td=new TextDecoder();
  for(let k=0;k<n;k++){const met=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    const name=td.decode(u.subarray(p+46,p+46+nl));const ln=v.getUint16(off+26,true),lx=v.getUint16(off+28,true),data=u.subarray(off+30+ln+lx,off+30+ln+lx+cs);
    out[name]={met,data};p+=46+nl+xl+cl}
  return {async texto(nm){const f=out[nm];if(!f)return null;const b=f.met===0?f.data:await abInflate(f.data);return td.decode(b)},nomes:Object.keys(out)};
}
async function abLerXlsx(file){
  const z=await abUnzip(await file.arrayBuffer()),dp=new DOMParser();
  const ss=[],sx=await z.texto('xl/sharedStrings.xml');
  if(sx){const d=dp.parseFromString(sx,'application/xml');[...d.getElementsByTagName('si')].forEach(si=>ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')))}
  let sheet='xl/worksheets/sheet1.xml';
  try{const wb=dp.parseFromString(await z.texto('xl/workbook.xml'),'application/xml'),rel=dp.parseFromString(await z.texto('xl/_rels/workbook.xml.rels'),'application/xml');
    const s1=wb.getElementsByTagName('sheet')[0],rid=s1&&(s1.getAttribute('r:id')||s1.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    const r=[...rel.getElementsByTagName('Relationship')].find(x=>x.getAttribute('Id')===rid);if(r){const t=r.getAttribute('Target').replace(/^\//,'');sheet=t.startsWith('xl/')?t:'xl/'+t}}catch(e){}
  const sxml=await z.texto(sheet)||await z.texto(z.nomes.find(n=>/^xl\/worksheets\/.*\.xml$/.test(n)));if(!sxml)throw new Error('Planilha vazia.');
  const d=dp.parseFromString(sxml,'application/xml'),rows=[];
  const col=ref=>{const m=String(ref||'').match(/^([A-Z]+)/);if(!m)return null;let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1};
  [...d.getElementsByTagName('row')].forEach(rw=>{const r=[];let ci=0;[...rw.getElementsByTagName('c')].forEach(c=>{const k=col(c.getAttribute('r'));if(k!=null)ci=k;const t=c.getAttribute('t'),vv=c.getElementsByTagName('v')[0];
    let val='';if(t==='s')val=ss[+(vv&&vv.textContent)]||'';else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else val=vv?vv.textContent:'';
    r[ci]=String(val).trim();ci++});rows.push(Array.from(r,x=>x||''))});
  return rows;
}
function abLerTexto(txt){
  txt=String(txt||'').replace(/\r\n?/g,'\n');const l1=txt.split('\n').find(x=>x.trim())||'';
  const sep=l1.includes('\t')?'\t':(l1.split(';').length>l1.split(',').length?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch;continue}
    if(ch==='"'&&!cur){q=true;continue}if(ch===sep){row.push(cur.trim());cur='';continue}if(ch==='\n'){row.push(cur.trim());rows.push(row);row=[];cur='';continue}cur+=ch}
  if(cur||row.length){row.push(cur.trim());rows.push(row)}
  return rows.filter(r=>r.some(x=>x));
}
const AB_CAMPOS=[['c','Código do projeto',/c[oó]d|n[uú]mero|^n[ºo°.]|documento|desenho/],['n','Nome / título',/t[ií]tulo|nome|descri/],['d','Disciplina',/disciplina|especialidade|[aá]rea|categoria/],['rev','Revisão',/^rev|revis/],['fl','Folhas',/folha|n[ºo°]? ?fls|p[aá]ginas/]];
function abMapear(rows){
  let hi=0,best=-1;rows.slice(0,15).forEach((r,i)=>{const sc=AB_CAMPOS.reduce((s,[,,re])=>s+(r.some(x=>re.test(abNorm(x)))?1:0),0);if(sc>best){best=sc;hi=i}});
  const H=rows[hi]||[],map={};
  AB_CAMPOS.forEach(([k,,re])=>{const i=H.findIndex((x,j)=>re.test(abNorm(x))&&!Object.values(map).includes(j));map[k]=i});
  if(best<1){hi=-1;map.c=0;map.n=1}
  return {hi,map};
}

async function compress(file,max=1600,q=.82){
  const url=URL.createObjectURL(file);
  try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));return b||file;
  }catch(e){return file}finally{URL.revokeObjectURL(url)}
}
async function uploadDraft(statusEl,pasta){
  const ids=[],its=S.draft?.items||[];
  for(let i=0;i<its.length;i++){statusEl.textContent=`Enviando foto ${i+1} de ${its.length}…`;const b=await compress(its[i].file,...fotoCfg());const type=['image/jpeg','image/png','image/webp','image/gif'].includes(b.type)?b.type:'image/jpeg';const r=await S.assets.upload(b,upOpts(type,pasta));ids.push(r.id)}
  return ids;
}

}

  async run(st,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,mode),s=t.objectStore(st);let out;const q=fn(s);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},

function traduz(m){m=String(m||'');
  if(/invalid|expired/i.test(m)&&/token|otp/i.test(m))return 'Código inválido ou vencido. Peça outro.';
  if(/anonymous sign-?ins are disabled/i.test(m))return 'Entrada por código desligada no Supabase: ligue "Anonymous sign-ins" em Authentication.';
  if(/only request this after/i.test(m))return 'Aguarde alguns segundos antes de pedir outro código.';
  if(/rate limit/i.test(m))return 'Limite de e-mails atingido. Tente mais tarde ou configure o envio de e-mail no Supabase.';
  if(/signups not allowed/i.test(m))return 'Cadastro por e-mail desligado no Supabase (Authentication → Email).';
  if(/JWT expired/i.test(m))return 'Sessão expirada. Abra o app de novo.';
  return m}
const SB={sess:null,
  load(){try{this.sess=JSON.parse(localStorage.getItem('pse.sb')||'null')}catch(e){this.sess=null}},
  save(s){this.sess=s;try{s?localStorage.setItem('pse.sb',JSON.stringify(s)):localStorage.removeItem('pse.sb')}catch(e){}},
  base(){return String(CFG.supabaseUrl||'').replace(/\/+$/,'')},
  async http(path,o){o=o||{};const h={apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'};
    if(o.auth!==false){await this.fresh();if(this.sess)h.Authorization='Bearer '+this.sess.access_token}
    let r;try{r=await fetch(this.base()+path,{method:o.method||'GET',headers:h,body:o.body!=null?JSON.stringify(o.body):undefined})}catch(e){throw erro('Sem conexão com a internet.','offline')}
    const txt=await r.text();let js=null;try{js=txt?JSON.parse(txt):null}catch(e){}
    if(!r.ok){const m=(js&&(js.message||js.msg||js.error_description||js.error))||('Erro '+r.status);throw erro(traduz(m),r.status===401||(js&&js.code==='PGRST301')?'auth':'server',r.status)}
    return js},
  setSess(js){if(!js||!js.access_token)throw erro('Login não concluído.');this.save({access_token:js.access_token,refresh_token:js.refresh_token,expires_at:Date.now()+((js.expires_in||3600)-90)*1000,anon:!!(js.user&&js.user.is_anonymous),email:(js.user&&js.user.email)||''})},
  async fresh(){if(!this.sess||Date.now()<this.sess.expires_at)return;if(this._r)return this._r;
    this._r=(async()=>{try{const js=await this.http('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:this.sess.refresh_token}});this.setSess(js)}
      catch(e){if(e.code!=='offline')this.save(null);throw e}finally{this._r=null}})();return this._r},
  async anon(){if(this.sess)return;this.setSess(await this.http('/auth/v1/signup',{method:'POST',auth:false,body:{data:{}}}))},
  async otp(email){const volta=location.href.split('#')[0].split('?')[0];await this.http('/auth/v1/otp?redirect_to='+encodeURIComponent(volta),{method:'POST',auth:false,body:{email,create_user:true}})},
  async verify(email,token){this.setSess(await this.http('/auth/v1/verify',{method:'POST',auth:false,body:{type:'email',email,token}}))},
  rpc(fn,args,anonimo){return this.http('/rest/v1/rpc/'+fn,{method:'POST',body:args||{},auth:!anonimo})},
  async logout(){try{await this.rpc('sair')}catch(e){}try{await this.http('/auth/v1/logout',{method:'POST'})}catch(e){}this.save(null)}};

/* ---- Google Drive (fotos e PDFs) ---- */
async function drive(op,extra){
  if(!CFG.driveUrl)throw erro('O endereço do script do Drive não foi configurado (config.js).');
  await SB.fresh();if(!SB.sess)throw erro('Entre no app primeiro.','auth');
  let r;try{r=await fetch(CFG.driveUrl,{method:'POST',body:JSON.stringify({op,token:SB.sess.access_token,...extra})})}catch(e){throw erro('Sem conexão com a internet.','offline')}
  let js=null;try{js=await r.json()}catch(e){throw erro('Resposta inválida do script do Drive. Confira a implantação.','server')}
  if(!js.ok)throw erro(js.erro||'Falha no Drive.','server');return js.r}
const blobToB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(b)});
const b64ToBlob=(b64,type)=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};

/* fotos tiradas sem sinal: ficam no aparelho com id provisório (tmp-) até subir */
const MAPA={}, ARQURL={};
function imgURL(id){id=String(id||'');if(id.startsWith('tmp-')){if(MAPA[id])id=MAPA[id];else return ARQURL[id]||''}return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1600'}
const trocarTmp=s=>s.replace(/tmp-[a-z0-9]{6,}/g,t=>MAPA[t]||t);
const assetsShim={pastas:true,
  async upload(blob,opts){const type=(opts&&opts.type)||blob.type||'image/jpeg',name=blob.name||('arquivo.'+(type==='application/pdf'?'pdf':'jpg')),pasta=(opts&&opts.pasta)||null;
    if(navigator.onLine&&SYNC.fila===0){try{const r=await drive('upload',{b64:await blobToB64(blob),mime:type,name,pasta});return {id:r.id,url:imgURL(r.id),sizeBytes:r.size,contentType:type}}
      catch(e){if(/maior que|Envie foto/i.test(e.message||''))throw e;SYNC.ultimoErro=e.message}}
    /* sem sinal ou falha no Drive: a foto fica no aparelho e sobe depois, sem perder o registro */
    const id='tmp-'+genId().toLowerCase().replace(/[^a-z0-9]/g,'');await LDB.put('arq',{id,blob,type,name,pasta});ARQURL[id]=URL.createObjectURL(blob);
    await filaAdd({t:'arq',tmp:id});return {id,url:ARQURL[id],sizeBytes:blob.size,contentType:type}},
  async delete(id){id=String(id||'');if(id.startsWith('tmp-')&&!MAPA[id]){await LDB.del('arq',id);return {deleted:true}}try{await drive('delete',{id:MAPA[id]||id})}catch(e){}return {deleted:true}}};
const API={async call(fn,id,forcar){
  if(fn==='api_uso'){const [d,b]=await Promise.all([drive('uso',{forcar:!!forcar}),SB.rpc('uso_banco').catch(()=>null)]);return {...d,banco:b&&b.banco,bancoLimite:CFG.bancoLimite||500*1024*1024,docs:b&&b.docs}}
  if(fn!=='api_file')throw erro('Função indisponível.');id=String(id||'');
  if(id.startsWith('tmp-')&&!MAPA[id]){const a=await LDB.get('arq',id);if(!a)throw erro('Foto não encontrada no aparelho.');return {mime:a.type,b64:await blobToB64(a.blob),name:a.name}}
  return drive('get',{id:MAPA[id]||id})}};
const dlShim={async save({filename,data}){
  const type=/\.csv$/i.test(filename)?'text/csv;charset=utf-8':/\.html?$/i.test(filename)?'text/html;charset=utf-8':(data&&data.type)||'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});
  if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&navigator.canShare){try{const f=new File([blob],filename,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return {status:'saved'}}}catch(e){if(e&&e.name==='AbortError')return {status:'declined'}}}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);return {status:'saved'}}};

/* ---- registros: cópia local + fila de envio ---- */
const Store={data:{},v:'',loaded:false,subs:[],dsubs:[],
  coll(c){return this.data[c]||(this.data[c]={})},
  snap(c){const docs=Object.entries(this.coll(c)).map(([id,o])=>({id,exists:true,data:()=>o}));return {docs,size:docs.length,empty:!docs.length}},
  dsnap(c,id){const o=this.coll(c)[id];return {id,exists:!!o,data:()=>o}},
  emit(){if(!this.loaded)return;for(const s of this.subs)s.cb(this.snap(s.c));for(const d of this.dsubs)d.cb(this.dsnap(d.c,d.id))}};
const SYNC={since:'',fila:0,busy:null,esperando:new Map(),erroAuth:false};
async function cacheSalvar(){try{await LDB.put('kv',{k:'docs',data:Store.data,since:SYNC.since,me:S.me&&S.me.id})}catch(e){}}
async function cacheLer(){try{const r=await LDB.get('kv','docs');if(r&&(!S.me||r.me===S.me.id)){Store.data=r.data||{};SYNC.since=r.since||''}}catch(e){}}
async function filaAdd(item){const n=await LDB.add('fila',{...item,em:Date.now()});SYNC.fila++;syncChip();return n}
function processarFila(){
  if(SYNC.busy)return SYNC.busy;
  SYNC.busy=(async()=>{let recusou=false;
    try{const itens=await LDB.all('fila');SYNC.fila=itens.length;
      for(const it of itens){
        if(!navigator.onLine)break;
        try{
          if(it.t==='arq'){const a=await LDB.get('arq',it.tmp);
            if(a){const r=await drive('upload',{b64:await blobToB64(a.blob),mime:a.type,name:a.name,pasta:a.pasta||null});MAPA[it.tmp]=r.id;await LDB.put('kv',{k:'mapa',m:MAPA});await LDB.del('arq',it.tmp)}}
          else if(it.t==='ops'){await SB.rpc('doc_write',{p_ops:JSON.parse(trocarTmp(JSON.stringify(it.ops)))})}
          await LDB.del('fila',it.n);SYNC.fila--;const w=SYNC.esperando.get(it.n);if(w){SYNC.esperando.delete(it.n);w.res()}
        }catch(e){
          if(e.code==='offline'||(e.status&&e.status>=500))break;
          if(it.t==='arq'){SYNC.ultimoErro=e.message;if(!SYNC.avisouDrive){SYNC.avisouDrive=true;toast('As fotos não estão subindo para o Drive ('+e.message+'). Os registros ficam guardados no aparelho e sobem sozinhos quando o Drive responder.')}break}  /* foto nunca é descartada */
          if(e.code==='auth'){SYNC.erroAuth=true;break}
          await LDB.del('fila',it.n);SYNC.fila--;recusou=true;const w=SYNC.esperando.get(it.n);if(w){SYNC.esperando.delete(it.n);w.rej(e)}else toast('Não foi gravado: '+errMsg(e));
        }
      }
      if(SYNC.fila===0)SYNC.ultimoErro='';
    }finally{SYNC.busy=null;for(const [n,w] of SYNC.esperando){SYNC.esperando.delete(n);w.res()}syncChip()}
    if(recusou){SYNC.since='';await puxar(true).catch(()=>{});Store.emit()}
  })();
  return SYNC.busy}
async function puxar(full){
  const since=full?'':SYNC.since,lim=1000;let mx=since,off=0;const dados=full?{}:Store.data;
  const desde=since?new Date(new Date(since).getTime()-5000).toISOString():'';
  for(;;){const js=await SB.http(`/rest/v1/docs?select=col,id,data,deleted,updated_at&order=updated_at.asc,col.asc,id.asc&limit=${lim}&offset=${off}${desde?'&updated_at=gte.'+encodeURIComponent(desde):''}`);
    for(const r of js){const c=dados[r.col]||(dados[r.col]={});if(r.deleted||!r.data)delete c[r.id];else c[r.id]=r.data;if(!mx||r.updated_at>mx)mx=r.updated_at}
    if(js.length<lim)break;off+=lim}
  Store.data=dados;SYNC.since=mx;await cacheSalvar()}
function mkDb(){
  const write=async ops=>{
    if(!S.me)throw erro('Entre no app para registrar.');
    for(const o of ops){const c=Store.coll(o.col);if(o.op==='delete')delete c[o.id];else if(o.op==='set')c[o.id]=JSON.parse(JSON.stringify(o.data));else c[o.id]=deepMerge(c[o.id],o.data)}
    Store.emit();cacheSalvar();
    const n=await filaAdd({t:'ops',ops:JSON.parse(JSON.stringify(ops))});
    if(!navigator.onLine)return;
    const espera=new Promise((res,rej)=>SYNC.esperando.set(n,{res,rej}));processarFila();
    await Promise.race([espera,new Promise(r=>setTimeout(r,12000))]);
  };
  const ref=(c,id)=>({id,path:c+'/'+id,
    set:d=>write([{op:'set',col:c,id,data:d}]),update:d=>write([{op:'update',col:c,id,data:d}]),delete:()=>write([{op:'delete',col:c,id}]),
    get:async()=>Store.dsnap(c,id),
    onSnapshot(cb){const s={c,id,cb};Store.dsubs.push(s);if(Store.loaded)setTimeout(()=>cb(Store.dsnap(c,id)));return ()=>{Store.dsubs=Store.dsubs.filter(x=>x!==s)}}});
  const coll=c=>({path:c,doc:id=>ref(c,id||genId()),orderBy(){return this},limit(){return this},where(){return this},
    add:async d=>{const r=ref(c,genId());await r.set(d);return r},get:async()=>Store.snap(c),
    onSnapshot(cb){const s={c,cb};Store.subs.push(s);if(Store.loaded)setTimeout(()=>cb(Store.snap(c)));return ()=>{Store.subs=Store.subs.filter(x=>x!==s)}}});
  return {doc:p=>{const [c,i]=String(p).split('/');return ref(c,i)},collection:coll};
}
function syncChip(){const el=$('#syncChip');if(!el)return;const off=!navigator.onLine;
  el.hidden=!(off||SYNC.fila>0);el.textContent=off?(SYNC.fila?`Sem sinal · ${SYNC.fila} a enviar`:'Sem sinal'):(SYNC.ultimoErro&&!SYNC.busy?`${SYNC.fila} aguardando envio`:`Enviando ${SYNC.fila}…`);
  el.title=SYNC.ultimoErro?('Último erro: '+SYNC.ultimoErro):''}
let refreshing=null;
function refresh(full){
  if(refreshing)return refreshing;
  refreshing=(async()=>{try{
    if(!CFG.supabaseUrl||!CFG.supabaseAnonKey){S.needConfig=true;Store.loaded=true;Store.emit();return}
    if(!SB.sess){S.me=null;Store.data={};Store.loaded=true;
      try{const e=await SB.rpc('estado',{},true);S.needSetup=!e.tem_usuarios}catch(e){}Store.emit();return}
    if(S.vincularEmail){S.vincularEmail=false;try{await SB.rpc('vincular_email')}catch(e){toast(errMsg(e));await SB.logout();return refreshDepois()}}
    let me=null;
    try{me=await SB.rpc('eu');LS.set('pse.me',JSON.stringify(me||null))}
    catch(e){if(e.code==='offline')me=JSON.parse(LS.get('pse.me')||'null');else if(e.code==='auth'){SB.save(null);return refreshDepois()}else throw e}
    const antes=S.me&&S.me.id;
    S.me=me&&me.id?{id:me.id,name:me.nome,tipo:me.tipo,isOwner:me.tipo==='admin',canEdit:me.tipo==='admin'}:null;
    if(!S.me){Store.data={};Store.loaded=true;try{const e=await SB.rpc('estado',{},true);S.needSetup=!e.tem_usuarios}catch(e){}Store.emit();return}
    if(!Store.loaded||antes!==S.me.id){await cacheLer();Store.loaded=true;Store.emit()}
    if(navigator.onLine){await processarFila();if(SYNC.fila===0){try{await puxar(full||!SYNC.since);Store.emit()}catch(e){if(e.code!=='offline')throw e}}}
  }catch(e){toast(errMsg(e))}finally{refreshing=null;S.boot=false;syncChip();onData()}})();
  return refreshing;
}
/* e-mail com link (modelo padrão do Supabase): o link volta para o app com o login no endereço */
function lerLinkEmail(){const h=location.hash||'';if(!/(access_token|error_description)=/.test(h))return;
  const p=new URLSearchParams(h.slice(1));try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(p.get('error_description')){setTimeout(()=>toast('O link do e-mail venceu ou já foi usado. Peça outro código.'),300);return}
  SB.save({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:Date.now()+((+p.get('expires_in')||3600)-90)*1000,anon:false,email:''});S.vincularEmail=true}
function refreshDepois(){setTimeout(()=>refresh(true),50)}
async function poll(){if(document.hidden)return;refresh()}
S.lg={modo:'cel',etapa:1,email:''};
async function doLogin(f){
  const er=f.querySelector('.ferr');er.textContent='';const bt=f.querySelector('button[type=submit]');if(bt)bt.disabled=true;
  try{
    if(S.lg.modo==='cel'){
      const c=String($('#lgCod')?.value||'').trim().toUpperCase();if(!c){er.textContent='Digite o código de acesso.';return}
      await SB.anon();const r=await SB.rpc('ativar',{p_codigo:c});if(r&&r.erro){er.textContent=r.erro;return}
    }else if(S.lg.etapa===1){
      const m=String($('#lgMail')?.value||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m)){er.textContent='Digite um e-mail válido.';return}
      await SB.otp(m);S.lg.email=m;S.lg.etapa=2;renderView();toast('Enviamos um código para '+m);setTimeout(()=>$('#lgOtp')?.focus(),60);return;
    }else{
      const t=String($('#lgOtp')?.value||'').replace(/\D/g,'');if(t.length<6){er.textContent='Digite o código de 6 dígitos do e-mail.';return}
      await SB.verify(S.lg.email,t);
      try{await SB.rpc('vincular_email')}catch(e){await SB.logout();throw e}
    }
    S.showLogin=false;S.lg.etapa=1;await refresh(true);toast('Bem-vindo'+(S.me?.name?', '+S.me.name:''));
  }catch(e){er.textContent=errMsg(e)}finally{if(bt&&bt.isConnected)bt.disabled=false}
}
async function doSetup(f){
  const fd=new FormData(f),nome=String(fd.get('nome')||'').trim(),c=String(fd.get('codigo')||'').trim().toUpperCase(),c2=String(fd.get('codigo2')||'').trim().toUpperCase(),er=f.querySelector('.ferr');er.textContent='';
  if(!nome){er.textContent='Informe seu nome.';return}
  if(c.length<6){er.textContent='O código precisa ter ao menos 6 caracteres.';return}
  if(c!==c2){er.textContent='Os códigos não conferem.';return}
  try{await SB.anon();await SB.rpc('setup_admin',{p_nome:nome,p_codigo:c});await refresh(true);toast('Administrador criado. Agora cadastre a subestação.')}catch(e){er.textContent=errMsg(e)}
}
async function logout(){
  if(SYNC.fila>0){toast(`Há ${SYNC.fila} alteração(ões) ainda não enviada(s). Conecte à internet antes de sair.`);return}
  await SB.logout();LS.del('pse.me');S.me=null;Store.data={};SYNC.since='';try{await LDB.clear('kv')}catch(e){}closeSheet();refresh();toast('Você saiu deste aparelho')}
function envioHTML(u,c){
  const url=location.href.split('#')[0].split('?')[0];
  const cont=String(c.contato||''),cod=c.codigo||'';
  if(/@/.test(cont))return `<a class="btn sm" target="_blank" rel="noopener" href="mailto:${esc(cont)}?subject=${encodeURIComponent('Acesso ao SGC')}&body=${encodeURIComponent(`Olá, ${u.nome}! Abra ${url} , escolha "E-mail" e entre com ${cont}. Você vai receber um código no e-mail. Se preferir, use o código de acesso ${cod}.`)}">E-mail</a>`;
  const dg=cont.replace(/\D/g,'');if(dg.length<10)return '';
  return `<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${dg.length<=11?'55'+dg:dg}?text=${encodeURIComponent(`Olá, ${u.nome}! Seu acesso ao SGC: ${url} — escolha "Celular" e digite o código ${cod}. Dá para instalar no celular pelo menu do navegador.`)}">WhatsApp</a>`;
}
/* instalar no celular */
let INST=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INST=e;const b=$('#instBtn');if(b)b.hidden=false});
window.addEventListener('appinstalled',()=>{const b=$('#instBtn');if(b)b.hidden=true;toast('App instalado. Abra pelo ícone na tela inicial.')});
function instalacao(){
  const ua=navigator.userAgent,inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(inst)return;
  const b=$('#instBtn');if(b)b.onclick=()=>{if(INST){INST.prompt();INST=null;b.hidden=true}else ajudaInstalar()};
  if(/iPhone|iPad|iPod/.test(ua)||/(FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\))/.test(ua)){if(b)b.hidden=false}
}
function ajudaInstalar(){const ua=navigator.userAgent;
  pushSheet({title:'Instalar o app',render:()=>`<p class="desc">${/(FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\))/.test(ua)?'<b>Você abriu o link dentro de outro app (WhatsApp, por exemplo).</b> Toque nos três pontinhos e escolha <b>Abrir no navegador</b> (Chrome ou Safari) e instale de lá.':''}</p>
    <div class="box"><h4>Android (Chrome)</h4><p class="desc">Toque em ⋮ (canto superior direito) → <b>Instalar app</b> ou <b>Adicionar à tela inicial</b> → Instalar.</p></div>
    <div class="box"><h4>iPhone (Safari)</h4><p class="desc">Toque em <b>Compartilhar</b> (quadrado com seta) → <b>Adicionar à Tela de Início</b> → Adicionar. Precisa ser pelo Safari.</p></div>
    <p class="hint">Depois de instalado, abra sempre pelo ícone na tela inicial.</p>`})}
function init(){
  renderNav();renderView();
  SB.load();lerLinkEmail();S.db=mkDb();S.assets=assetsShim;S.dl=dlShim;S.user=null;S.code='app';
  LDB.get('kv','mapa').then(r=>{if(r&&r.m)Object.assign(MAPA,r.m)}).catch(()=>{});
  LDB.all('arq').then(as=>{as.forEach(a=>{ARQURL[a.id]=URL.createObjectURL(a.blob)});if(as.length)onData()}).catch(()=>{});
  LDB.all('fila').then(f=>{SYNC.fila=f.length;syncChip()}).catch(()=>{});
  sub('subestacoes','ses','loadedSE',(a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  sub('pendencias','pends','loadedP',(a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  sub('testes','tests','loadedT');
  sub('obra','obra','loadedO');
  sub('oem','oem');
  sub('asbuilt','asbuilt');
  sub('energ','energ');
  sub('usuarios','users','loadedU',(a,b)=>(a.tipo==='admin'?-1:b.tipo==='admin'?1:String(a.nome).localeCompare(String(b.nome),'pt-BR')));
  S.db.collection('contatos').onSnapshot(snap=>{S.contatos=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));onData()});
  S.db.doc('config/ensaios').onSnapshot(d=>{S.cat=d.exists?d.data():null;onData()});
  refresh();
  setInterval(poll,25000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  window.addEventListener('online',()=>{syncChip();refresh()});window.addEventListener('offline',syncChip);
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  instalacao();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
init();
