/* ---- Supabase (REST, sem biblioteca externa) ---- */
function traduz(m){m=String(m||'');
  if(/invalid|expired/i.test(m)&&/token|otp/i.test(m))return 'Código inválido ou vencido. Peça outro.';
  if(/anonymous sign-?ins are disabled/i.test(m))return 'Entrada por código desligada no Supabase: ligue "Anonymous sign-ins" em Authentication.';
  if(/only request this after/i.test(m))return 'Aguarde alguns segundos antes de pedir outro código.';
  if(/rate limit/i.test(m))return 'Limite de e-mails atingido. Tente mais tarde ou configure o envio de e-mail no Supabase.';
  if(/signups not allowed/i.test(m))return 'Cadastro por e-mail desligado no Supabase (Authentication → Email).';
  if(/JWT expired/i.test(m))return 'Sessão expirada. Abra o app de novo.';
  return m}
const SB={sess:null,
  load(){try{this.sess=JSON.parse(localStorage.getItem('pse.sb')||'null')}catch(e){this.sess=null}},
  save(s){this.sess=s;try{s?localStorage.setItem('pse.sb',JSON.stringify(s)):localStorage.removeItem('pse.sb')}catch(e){}},
  base(){return String(CFG.supabaseUrl||'').replace(/\/+$/,'')},
  async http(path,o){o=o||{};const h={apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'};
    if(o.auth!==false){await this.fresh();if(this.sess)h.Authorization='Bearer '+this.sess.access_token}
    let r;try{r=await fetch(this.base()+path,{method:o.method||'GET',headers:h,body:o.body!=null?JSON.stringify(o.body):undefined})}catch(e){throw erro('Sem conexão com a internet.','offline')}
    const txt=await r.text();let js=null;try{js=txt?JSON.parse(txt):null}catch(e){}
    if(!r.ok){const m=(js&&(js.message||js.msg||js.error_description||js.error))||('Erro '+r.status);throw erro(traduz(m),r.status===401||(js&&js.code==='PGRST301')?'auth':'server',r.status)}
    return js},
  setSess(js){if(!js||!js.access_token)throw erro('Login não concluído.');this.save({access_token:js.access_token,refresh_token:js.refresh_token,expires_at:Date.now()+((js.expires_in||3600)-90)*1000,anon:!!(js.user&&js.user.is_anonymous),email:(js.user&&js.user.email)||''})},
  async fresh(){if(!this.sess||Date.now()<this.sess.expires_at)return;if(this._r)return this._r;
    this._r=(async()=>{try{const js=await this.http('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:this.sess.refresh_token}});this.setSess(js)}
      catch(e){if(e.code!=='offline')this.save(null);throw e}finally{this._r=null}})();return this._r},
  async anon(){if(this.sess)return;this.setSess(await this.http('/auth/v1/signup',{method:'POST',auth:false,body:{data:{}}}))},
  async otp(email){const volta=location.href.split('#')[0].split('?')[0];await this.http('/auth/v1/otp?redirect_to='+encodeURIComponent(volta),{method:'POST',auth:false,body:{email,create_user:true}})},
  async verify(email,token){this.setSess(await this.http('/auth/v1/verify',{method:'POST',auth:false,body:{type:'email',email,token}}))},
  rpc(fn,args,anonimo){return this.http('/rest/v1/rpc/'+fn,{method:'POST',body:args||{},auth:!anonimo})},
  async logout(){try{await this.rpc('sair')}catch(e){}try{await this.http('/auth/v1/logout',{method:'POST'})}catch(e){}this.save(null)}};

async function drive(op,extra){
  if(!CFG.driveUrl)throw erro('O endereço do script do Drive não foi configurado (config.js).');
  await SB.fresh();if(!SB.sess)throw erro('Entre no app primeiro.','auth');
  let r;try{r=await fetch(CFG.driveUrl,{method:'POST',body:JSON.stringify({op,token:SB.sess.access_token,...extra})})}catch(e){throw erro('Sem conexão com a internet.','offline')}
  let js=null;try{js=await r.json()}catch(e){throw erro('Resposta inválida do script do Drive. Confira a implantação.','server')}
  if(!js.ok)throw erro(js.erro||'Falha no Drive.','server');return js.r}
const blobToB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(b)});

        try{
          if(it.t==='arq'){const a=await LDB.get('arq',it.tmp);
            if(a){const r=await drive('upload',{b64:await blobToB64(a.blob),mime:a.type,name:a.name});MAPA[it.tmp]=r.id;await LDB.put('kv',{k:'mapa',m:MAPA});await LDB.del('arq',it.tmp)}}
          else if(it.t==='ops'){await SB.rpc('doc_write',{p_ops:JSON.parse(trocarTmp(JSON.stringify(it.ops)))})}
          await LDB.del('fila',it.n);SYNC.fila--;const w=SYNC.esperando.get(it.n);if(w){SYNC.esperando.delete(it.n);w.res()}
        }catch(e){
          if(e.code==='offline'||(e.status&&e.status>=500))break;
          if(e.code==='auth'){SYNC.erroAuth=true;break}
          await LDB.del('fila',it.n);SYNC.fila--;recusou=true;const w=SYNC.esperando.get(it.n);if(w){SYNC.esperando.delete(it.n);w.rej(e)}else toast('Não foi gravado: '+errMsg(e));
        }
      }
    }finally{SYNC.busy=null;for(const [n,w] of SYNC.esperando){SYNC.esperando.delete(n);w.res()}syncChip()}
    if(recusou){SYNC.since='';await puxar(true).catch(()=>{});Store.emit()}
  })();
  return SYNC.busy}
async function puxar(full){
  const since=full?'':SYNC.since,lim=1000;let mx=since,off=0;const dados=full?{}:Store.data;
  const desde=since?new Date(new Date(since).getTime()-5000).toISOString():'';
  for(;;){const js=await SB.http(`/rest/v1/docs?select=col,id,data,deleted,updated_at&order=updated_at.asc,col.asc,id.asc&limit=${lim}&offset=${off}${desde?'&updated_at=gte.'+encodeURIComponent(desde):''}`);
    for(const r of js){const c=dados[r.col]||(dados[r.col]={});if(r.deleted||!r.data)delete c[r.id];else c[r.id]=r.data;if(!mx||r.updated_at>mx)mx=r.updated_at}
    if(js.length<lim)break;off+=lim}
  Store.data=dados;SYNC.since=mx;await cacheSalvar()}
function mkDb(){
  const write=async ops=>{
    if(!S.me)throw erro('Entre no app para registrar.');
    for(const o of ops){const c=Store.coll(o.col);if(o.op==='delete')delete c[o.id];else if(o.op==='set')c[o.id]=JSON.parse(JSON.stringify(o.data));else c[o.id]=deepMerge(c[o.id],o.data)}
    Store.emit();cacheSalvar();
    const n=await filaAdd({t:'ops',ops:JSON.parse(JSON.stringify(ops))});
    if(!navigator.onLine)return;
    const espera=new Promise((res,rej)=>SYNC.esperando.set(n,{res,rej}));processarFila();
    await Promise.race([espera,new Promise(r=>setTimeout(r,12000))]);
  };
  const ref=(c,id)=>({id,path:c+'/'+id,
    set:d=>write([{op:'set',col:c,id,data:d}]),update:d=>write([{op:'update',col:c,id,data:d}]),delete:()=>write([{op:'delete',col:c,id}]),
    get:async()=>Store.dsnap(c,id),
    onSnapshot(cb){const s={c,id,cb};Store.dsubs.push(s);if(Store.loaded)setTimeout(()=>cb(Store.dsnap(c,id)));return ()=>{Store.dsubs=Store.dsubs.filter(x=>x!==s)}}});
  const coll=c=>({path:c,doc:id=>ref(c,id||genId()),orderBy(){return this},limit(){return this},where(){return this},
    add:async d=>{const r=ref(c,genId());await r.set(d);return r},get:async()=>Store.snap(c),
    onSnapshot(cb){const s={c,cb};Store.subs.push(s);if(Store.loaded)setTimeout(()=>cb(Store.snap(c)));return ()=>{Store.subs=Store.subs.filter(x=>x!==s)}}});
  return {doc:p=>{const [c,i]=String(p).split('/');return ref(c,i)},collection:coll};
}
function syncChip(){const el=$('#syncChip');if(!el)return;const off=!navigator.onLine;
  el.hidden=!(off||SYNC.fila>0);el.textContent=off?(SYNC.fila?`Sem sinal · ${SYNC.fila} a enviar`:'Sem sinal'):`Enviando ${SYNC.fila}…`}
let refreshing=null;
function refresh(full){
  if(refreshing)return refreshing;
  refreshing=(async()=>{try{
    if(!CFG.supabaseUrl||!CFG.supabaseAnonKey){S.needConfig=true;Store.loaded=true;Store.emit();return}
    if(!SB.sess){S.me=null;Store.data={};Store.loaded=true;
      try{const e=await SB.rpc('estado',{},true);S.needSetup=!e.tem_usuarios}catch(e){}Store.emit();return}
    if(S.vincularEmail){S.vincularEmail=false;try{await SB.rpc('vincular_email')}catch(e){toast(errMsg(e));await SB.logout();return refreshDepois()}}
    let me=null;
    try{me=await SB.rpc('eu');LS.set('pse.me',JSON.stringify(me||null))}
    catch(e){if(e.code==='offline')me=JSON.parse(LS.get('pse.me')||'null');else if(e.code==='auth'){SB.save(null);return refreshDepois()}else throw e}
    const antes=S.me&&S.me.id;
    S.me=me&&me.id?{id:me.id,name:me.nome,tipo:me.tipo,isOwner:me.tipo==='admin',canEdit:me.tipo==='admin'}:null;
    if(!S.me){Store.data={};Store.loaded=true;try{const e=await SB.rpc('estado',{},true);S.needSetup=!e.tem_usuarios}catch(e){}Store.emit();return}
    if(!Store.loaded||antes!==S.me.id){await cacheLer();Store.loaded=true;Store.emit()}
    if(navigator.onLine){await processarFila();if(SYNC.fila===0){try{await puxar(full||!SYNC.since);Store.emit()}catch(e){if(e.code!=='offline')throw e}}}
  }catch(e){toast(errMsg(e))}finally{refreshing=null;S.boot=false;syncChip();onData()}})();
  return refreshing;
}
/* e-mail com link (modelo padrão do Supabase): o link volta para o app com o login no endereço */
function lerLinkEmail(){const h=location.hash||'';if(!/(access_token|error_description)=/.test(h))return;
  const p=new URLSearchParams(h.slice(1));try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(p.get('error_description')){setTimeout(()=>toast('O link do e-mail venceu ou já foi usado. Peça outro código.'),300);return}
  SB.save({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:Date.now()+((+p.get('expires_in')||3600)-90)*1000,anon:false,email:''});S.vincularEmail=true}
function refreshDepois(){setTimeout(()=>refresh(true),50)}
async function poll(){if(document.hidden)return;refresh()}
S.lg={modo:'cel',etapa:1,email:''};
async function doLogin(f){
  const er=f.querySelector('.ferr');er.textContent='';const bt=f.querySelector('button[type=submit]');if(bt)bt.disabled=true;
  try{
    if(S.lg.modo==='cel'){
      const c=String($('#lgCod')?.value||'').trim().toUpperCase();if(!c){er.textContent='Digite o código de acesso.';return}
      await SB.anon();const r=await SB.rpc('ativar',{p_codigo:c});if(r&&r.erro){er.textContent=r.erro;return}
    }else if(S.lg.etapa===1){
      const m=String($('#lgMail')?.value||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m)){er.textContent='Digite um e-mail válido.';return}
      await SB.otp(m);S.lg.email=m;S.lg.etapa=2;renderView();toast('Enviamos um código para '+m);setTimeout(()=>$('#lgOtp')?.focus(),60);return;
    }else{
      const t=String($('#lgOtp')?.value||'').replace(/\D/g,'');if(t.length<6){er.textContent='Digite o código de 6 dígitos do e-mail.';return}
      await SB.verify(S.lg.email,t);
      try{await SB.rpc('vincular_email')}catch(e){await SB.logout();throw e}
    }
    S.showLogin=false;S.lg.etapa=1;await refresh(true);toast('Bem-vindo'+(S.me?.name?', '+S.me.name:''));
  }catch(e){er.textContent=errMsg(e)}finally{if(bt&&bt.isConnected)bt.disabled=false}
}
async function doSetup(f){
  const fd=new FormData(f),nome=String(fd.get('nome')||'').trim(),c=String(fd.get('codigo')||'').trim().toUpperCase(),c2=String(fd.get('codigo2')||'').trim().toUpperCase(),er=f.querySelector('.ferr');er.textContent='';
  if(!nome){er.textContent='Informe seu nome.';return}
  if(c.length<6){er.textContent='O código precisa ter ao menos 6 caracteres.';return}
  if(c!==c2){er.textContent='Os códigos não conferem.';return}
  try{await SB.anon();await SB.rpc('setup_admin',{p_nome:nome,p_codigo:c});await refresh(true);toast('Administrador criado. Agora cadastre a subestação.')}catch(e){er.textContent=errMsg(e)}
}
async function logout(){
  if(SYNC.fila>0){toast(`Há ${SYNC.fila} alteração(ões) ainda não enviada(s). Conecte à internet antes de sair.`);return}
  await SB.logout();LS.del('pse.me');S.me=null;Store.data={};SYNC.since='';try{await LDB.clear('kv')}catch(e){}closeSheet();refresh();toast('Você saiu deste aparelho')}
function envioHTML(u,c){
  const url=location.href.split('#')[0].split('?')[0];
  const cont=String(c.contato||''),cod=c.codigo||'';
  if(/@/.test(cont))return `<a class="btn sm" target="_blank" rel="noopener" href="mailto:${esc(cont)}?subject=${encodeURIComponent('Acesso ao app Pendências SE')}&body=${encodeURIComponent(`Olá, ${u.nome}! Abra ${url} , escolha "E-mail" e entre com ${cont}. Você vai receber um código no e-mail. Se preferir, use o código de acesso ${cod}.`)}">E-mail</a>`;
  const dg=cont.replace(/\D/g,'');if(dg.length<10)return '';
  return `<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${dg.length<=11?'55'+dg:dg}?text=${encodeURIComponent(`Olá, ${u.nome}! Seu acesso ao app Pendências SE: ${url} — escolha "Celular" e digite o código ${cod}. Dá para instalar no celular pelo menu do navegador.`)}">WhatsApp</a>`;
}
function init(){
  renderNav();renderView();
  SB.load();lerLinkEmail();S.db=mkDb();S.assets=assetsShim;S.dl=dlShim;S.user=null;S.code='app';
  LDB.get('kv','mapa').then(r=>{if(r&&r.m)Object.assign(MAPA,r.m)}).catch(()=>{});
  LDB.all('arq').then(as=>{as.forEach(a=>{ARQURL[a.id]=URL.createObjectURL(a.blob)});if(as.length)onData()}).catch(()=>{});
  LDB.all('fila').then(f=>{SYNC.fila=f.length;syncChip()}).catch(()=>{});
  sub('subestacoes','ses','loadedSE',(a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  sub('pendencias','pends','loadedP',(a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  sub('testes','tests','loadedT');
  sub('obra','obra','loadedO');
  sub('usuarios','users','loadedU',(a,b)=>(a.tipo==='admin'?-1:b.tipo==='admin'?1:String(a.nome).localeCompare(String(b.nome),'pt-BR')));
  S.db.collection('contatos').onSnapshot(snap=>{S.contatos=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));onData()});
  S.db.doc('config/ensaios').onSnapshot(d=>{S.cat=d.exists?d.data():null;onData()});
  refresh();
  setInterval(poll,25000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  window.addEventListener('online',()=>{syncChip();refresh()});window.addEventListener('offline',syncChip);
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
init();
</script>
